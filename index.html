<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoeHtet — နည်းပညာ Sharing</title>
<style>
  :root{
    --blue:#0057d9; --blue2:#0090ff; --ink:#13233d; --muted:#68798f; --soft:#93a5bb;
    --line:#e2eaf3; --bg:#eef3fa; --gold:#f5a623;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; min-height:100vh; color:var(--ink); padding-bottom:86px;
    font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(180deg,#eaf2fd 0%,#eef3fa 220px,#eef3fa 100%);
  }
  .wrap{max-width:760px; margin:0 auto}
  .app-header{
    color:#fff; padding:24px 16px 22px;
    background:linear-gradient(155deg,#0052cc 0%,#0070f3 48%,#00a3ff 100%);
    border-radius:0 0 30px 30px;
    box-shadow:0 18px 40px rgba(0,87,217,.28);
  }
  .greet-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .greet-left{display:flex; align-items:center; gap:12px}
  .avatar{
    width:47px; height:47px; border-radius:50%; display:grid; place-items:center;
    background:rgba(255,255,255,.20); border:1.5px solid rgba(255,255,255,.55);
    font-size:21px; font-weight:900;
  }
  .greet{font-size:13px; opacity:.88}
  .gname{font-size:19px; font-weight:850; letter-spacing:-.01em; margin-top:2px}
  .star-pill{
    padding:8px 12px; border-radius:999px; font-size:12.5px; font-weight:800;
    background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
  }
  .wallet-card{
    margin-top:19px; padding:17px; border-radius:23px;
    background:linear-gradient(140deg,rgba(255,255,255,.24),rgba(255,255,255,.10));
    border:1px solid rgba(255,255,255,.38);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
    backdrop-filter:blur(10px);
  }
  .w-label{font-size:11px; font-weight:800; letter-spacing:.20em; opacity:.85}
  .w-big{font-size:20px; font-weight:850; margin-top:8px; line-height:1.45}
  .w-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:13px}
  .w-chips span{padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.20); font-size:12.5px; font-weight:600}
  .quick{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:20px}
  .qa{
    background:none; border:0; cursor:pointer; color:#fff; padding:0;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    font-size:12px; font-weight:600; font-family:inherit;
  }
  .qa-ic{
    width:52px; height:52px; border-radius:50%; display:grid; place-items:center;
    background:#fff; font-size:22px; box-shadow:0 8px 18px rgba(0,40,100,.22);
    transition:transform .15s, box-shadow .15s;
  }
  .qa.active .qa-ic{box-shadow:0 0 0 3px var(--gold),0 10px 20px rgba(0,40,100,.28); transform:translateY(-2px)}
  .qa.active{font-weight:850}
  .popular{max-width:760px; margin:0 auto; padding:20px 16px 0}
  .sec-title{font-size:17px; font-weight:850; color:var(--ink); margin:4px 2px 12px}
  .pop-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:11px}
  .tile{
    background:#fff; border:1px solid var(--line); border-radius:20px; padding:15px 6px 13px;
    text-align:center; text-decoration:none; color:var(--ink);
    box-shadow:0 8px 22px rgba(19,35,61,.06);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-size:12.5px; font-weight:650; line-height:1.35;
  }
  .t-ic{font-size:26px}
  main{max-width:760px; margin:0 auto; padding:8px 16px 26px}
  .card{
    background:#fff; margin-top:14px; padding:20px; border-radius:24px;
    border:1px solid var(--line); box-shadow:0 10px 28px rgba(19,35,61,.07);
  }
  .meta-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:11px}
  .tag{
    display:inline-flex; align-items:center; padding:6px 11px; border-radius:999px;
    color:var(--blue); background:#e7f0ff; font-size:12px; font-weight:750;
  }
  .date{color:var(--soft); font-size:12px; white-space:nowrap}
  .card h2{margin:0; font-size:21px; line-height:1.4; letter-spacing:-.01em; color:var(--ink)}
  .card p{color:#46566e; line-height:1.85; margin:10px 0 0; white-space:pre-wrap; word-break:break-word; font-size:15.5px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:44px;
    background:linear-gradient(135deg,var(--blue),var(--blue2)); color:#fff; text-decoration:none;
    padding:11px 18px; border-radius:999px; font-weight:800; font-size:14px;
    box-shadow:0 10px 22px rgba(0,87,217,.25);
  }
  .btn.file{background:linear-gradient(135deg,#0dbd78,#079669); box-shadow:0 10px 22px rgba(16,185,129,.22)}
  .btn.video{background:linear-gradient(135deg,#8b5cf6,#c026d3); box-shadow:0 10px 22px rgba(168,85,247,.22)}
  .img{width:100%; border-radius:17px; margin-top:14px; background:#dfe8f2; border:1px solid var(--line); display:block}
  .actions{display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:16px}
  .sharebtn{
    min-height:42px; background:#eef4fc; color:var(--blue); border:1px solid #d7e5f6;
    border-radius:999px; padding:9px 15px; font-size:13px; font-weight:750; cursor:pointer; font-family:inherit;
  }
  .allink{color:var(--blue); font-size:15px; font-weight:750; text-decoration:none}
  .state-card{
    margin-top:16px; padding:32px 20px; text-align:center; color:var(--ink);
    border-radius:24px; border:1px solid var(--line); background:#fff;
    box-shadow:0 10px 28px rgba(19,35,61,.07);
  }
  .state-card small{display:block; margin-top:7px; color:var(--muted)}
  .spinner{
    width:38px; height:38px; margin:0 auto 15px; border-radius:50%;
    border:3px solid #dbe8f8; border-top-color:var(--blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #feed > p{
    margin-top:16px; padding:28px 20px !important; text-align:center;
    border-radius:24px; border:1px solid var(--line); background:#fff;
    color:var(--muted) !important; box-shadow:0 10px 28px rgba(19,35,61,.07);
  }
  footer{text-align:center; color:var(--soft); font-size:13px; padding:6px 20px 14px}
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:rgba(255,255,255,.94); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); box-shadow:0 -8px 24px rgba(19,35,61,.06);
  }
  .bn-in{max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr)}
  .bn-in a{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:9px 0 11px; text-decoration:none; color:var(--muted);
    font-size:11.5px; font-weight:650;
  }
  .bn-in a span{font-size:21px}
  .bn-in a.active{color:var(--blue); font-weight:850}
  @media (max-width:600px){
    .qa-ic{width:47px;height:47px;font-size:20px}
    .gname{font-size:17.5px}
    .w-big{font-size:18.5px}
    .card{padding:18px}
    .pop-grid{gap:9px}
    .tile{font-size:11.5px; padding:13px 4px 11px}
    .t-ic{font-size:23px}
  }
</style>
</head>
<body>
<header class="app-header"><div class="wrap">
  <div class="greet-row">
    <div class="greet-left"><div class="avatar">M</div><div><div class="greet">မင်္ဂလာပါ 👋</div><div class="gname">MoeHtet Tech Sharing</div></div></div>
    <div class="star-pill">⭐ Premium</div>
  </div>
  <div class="wallet-card">
    <div class="w-label">TECH SHARING WALLET</div>
    <div class="w-big">နည်းပညာ tips နဲ့ app တွေ စုစည်းရာ</div>
    <div class="w-chips"><span>⚡ မြန်ဆန်</span><span>📱 Mobile First</span><span>✨ နေ့တိုင်း Update</span></div>
  </div>
  <div class="quick">
    <button class="qa active" onclick="setFilter(this,'')"><span class="qa-ic">🧾</span><span>အားလုံး</span></button>
    <button class="qa" onclick="setFilter(this,'App')"><span class="qa-ic">⬇️</span><span>Apps</span></button>
    <button class="qa" onclick="setFilter(this,'File')"><span class="qa-ic">📄</span><span>Files</span></button>
    <button class="qa" onclick="setFilter(this,'Video')"><span class="qa-ic">▶️</span><span>Video</span></button>
    <button class="qa" onclick="setFilter(this,'ပုံ')"><span class="qa-ic">🖼️</span><span>ပုံများ</span></button>
  </div>
</div></header>
<section class="popular">
  <div class="sec-title">⭐ Popular</div>
  <div class="pop-grid">
    <a class="tile" href="https://github.com/moehtetdata/moehtet/releases/download/v0.3.3/MoeHtet.apk" target="_blank" rel="noopener"><span class="t-ic">📱</span><span>MoeHtet VPN</span></a>
    <a class="tile" href="https://moehtet.pages.dev" target="_blank" rel="noopener"><span class="t-ic">🛒</span><span>MoeHtet Shop</span></a>

  </div>
</section>
<main id="feed">
  <div class="state-card"><div class="spinner"></div><div>Post တွေ ယူနေတယ်…</div><small>ခဏစောင့်ပါ</small></div>
</main>
<footer>© MoeHtet — နည်းပညာ Sharing</footer>

  <a href="#feed"><span>📰</span>Posts</a>

  <a href="https://github.com/moehtetdata/moehtet/releases/download/v0.3.3/MoeHtet.apk" target="_blank" rel="noopener"><span>⬇️</span>VPN App</a>
</div></nav>
<script>
var API = 'https://script.google.com/macros/s/AKfycbyeXvBLYcbe038_QFTxiwulGH-oVbgsXI5_9VZ025MjfMaVGlRa_2QUX-0T6LTQeaxG8w/exec';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function btnFor(p){
  if(!p.link) return '';
  if(p.type.indexOf('File')>-1) return '<a class="btn file" href="'+esc(p.link)+'" target="_blank" rel="noopener">📄 File ဒေါင်းလုဒ်</a>';
  if(p.type.indexOf('Video')>-1) return '<a class="btn video" href="'+esc(p.link)+'" target="_blank" rel="noopener">▶️ Video ကြည့်ရန်</a>';
  if(p.type.indexOf('App')>-1) return '<a class="btn" href="'+esc(p.link)+'" target="_blank" rel="noopener">⬇️ App Link</a>';
  return '<a class="btn" href="'+esc(p.link)+'" target="_blank" rel="noopener">🔗 Link</a>';
}
function cardHtml(p){
  var d=p.ts? new Date(p.ts):null;
  var ds=d? ('<div class="date">'+d.toLocaleDateString('en-GB')+'</div>') : '';
  var img=(p.type.indexOf('ပုံ')>-1 && p.link)? '<img class="img" src="'+esc(p.link)+'" alt="">' : '';
  var vid=(!img && p.type.indexOf('Video')>-1 && p.link && p.link.indexOf('drive.google.com')>-1)? '<div style="position:relative;padding-top:56.25%;margin-top:10px"><iframe src="'+esc(p.link)+'" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:12px" allowfullscreen></iframe></div>' : '';
  var media=img||vid;
  var share=p.id? '<button class="sharebtn" onclick="copyLink(this,\''+esc(p.id)+'\')">🔗 Link ကူးမယ်</button>' : '';
  return '<article class="card"><div class="meta-row"><span class="tag">'+esc(p.type)+'</span>'+ds+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.body)+'</p>'+media+'<div class="actions">'+(media?'':btnFor(p))+share+'</div></article>';
}
var allPosts=[];
var curFilter='';
function render(posts){ renderFeed(); }
function renderFeed(){
  var list=[];
  for(var i=0;i<allPosts.length;i++){ if(!curFilter || allPosts[i].type.indexOf(curFilter)>-1) list.push(allPosts[i]); }
  var feed=document.getElementById('feed');
  if(!list.length){ feed.innerHTML='<p>ဒီ အမျိုးအစားမှာ post မရှိသေးဘူး</p>'; return; }
  var h='<div class="sec-title" style="margin-top:20px">📰 နောက်ဆုံး Post များ</div>';
  for(var j=0;j<list.length;j++) h+=cardHtml(list[j]);
  feed.innerHTML=h;
}
function setFilter(btn,f){
  curFilter=f;
  var btns=document.querySelectorAll('.qa');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  if(btn) btn.classList.add('active');
  if(allPosts.length) renderFeed();
}
function openSupport(e){
  if(e) e.preventDefault();
  if(window.Tawk_API && Tawk_API.maximize) Tawk_API.maximize();
}
function start(posts){
  loaded=true;
  allPosts=posts||[];
  if(!posts || !posts.length){
    document.getElementById('feed').innerHTML='<p style="text-align:center;color:#aaa;padding:36px 0">ခုထိ post မရှိသေးဘူး</p>';
    return;
  }
  var hsh=location.hash.replace('#','');
  if(hsh){
    for(var i=0;i<posts.length;i++){
      if(posts[i].id===hsh){
        document.getElementById('feed').innerHTML='<p><a class="allink" href="./">← Post အားလုံး ကြည့်မယ်</a></p>'+cardHtml(posts[i]);
        return;
      }
    }
  }
  render(posts);
}
function copyLink(btn,id){
  var url='https://paingmoehtet.from-mm.dev/#'+id;
  var ta=document.createElement('textarea');
  ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  var ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  function done(){ btn.textContent='✅ ကူးပြီးပြီ'; setTimeout(function(){ btn.textContent='🔗 Link ကူးမယ်'; },2000); }
  if(ok){ done(); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done, function(){ btn.textContent=url; }); }
  else { btn.textContent=url; }
}
var loaded=false;
var cb='mp'+Date.now();
window[cb]=function(res){ if(res && res.ok) start(res.posts); };
setTimeout(function(){
  if(!loaded){
    var f=document.getElementById('feed');
    if(f) f.innerHTML='<p style="text-align:center;color:#aaa;padding:36px 0">Connection နှေးနေတယ် — page ကို refresh ပြန်လုပ်ပါ</p>';
  }
}, 20000);
var s=document.createElement('script');
s.src=API+'?callback='+cb+'&nocache='+Date.now();
document.body.appendChild(s);
</script>

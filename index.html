<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoeHtet — နည်းပညာ Sharing</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f2f2f2}
  header{padding:20px 16px 8px;text-align:center}
  header h1{margin:0;font-size:26px} header p{color:#aaa;margin:6px 0 0}
  main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
  .card{background:#1a1d24;border-radius:16px;padding:16px;margin-top:16px}
  .card h2{margin:0 0 6px;font-size:19px} .card p{color:#ddd;line-height:1.6;margin:8px 0;white-space:pre-wrap;word-break:break-word}
  .tag{display:inline-block;background:#2a2f3a;color:#9fb4ff;border-radius:20px;padding:3px 10px;font-size:12px;margin-right:6px}
  .date{color:#888;font-size:12px}
  .btn{display:inline-block;margin-top:10px;background:#2f7bff;color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700}
  .btn.file{background:#1f9d63} .btn.video{background:#8b5cf6}
  .img{width:100%;border-radius:12px;margin-top:10px;background:#222}
  .sharebtn{margin-top:12px;background:#2a2f3a;color:#9fb4ff;border:0;border-radius:8px;padding:8px 14px;font-size:13px}
  .allink{color:#9fb4ff;font-size:15px}
  footer{text-align:center;color:#777;font-size:13px;padding:20px}
  footer a{color:#9fb4ff}
</style>
</head>
<body>
<header>
  <h1>📱 MoeHtet</h1>
  <p>နည်းပညာနဲ့ပတ်သက်တာ sharing တင်တဲ့နေရာ</p>
</header>
<main id="feed">
  <div style="text-align:center;color:#aaa;padding:36px 0">⏳ Post တွေ ယူနေတယ်…</div>
</main>
<script>
var API = 'https://script.google.com/macros/s/AKfycbyeXvBLYcbe038_QFTxiwulGH-oVbgsXI5_9VZ025MjfMaVGlRa_2QUX-0T6LTQeaxG8w/exec';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function btnFor(p){
  if(!p.link) return '';
  if(p.type.indexOf('File')>-1) return '<a class="btn file" href="'+esc(p.link)+'" target="_blank" rel="noopener">📄 File ဒေါင်းလုဒ်</a>';
  if(p.type.indexOf('Video')>-1) return '<a class="btn video" href="'+esc(p.link)+'" target="_blank" rel="noopener">▶️ Video ကြည့်ရန်</a>';
  if(p.type.indexOf('App')>-1) return '<a class="btn" href="'+esc(p.link)+'" target="_blank" rel="noopener">⬇️ App Link</a>';
  return '<a class="btn" href="'+esc(p.link)+'" target="_blank" rel="noopener">🔗 Link</a>';
}
function cardHtml(p){
  var d=p.ts? new Date(p.ts):null;
  var ds=d? ('<div class="date">'+d.toLocaleDateString('en-GB')+'</div>') : '';
  var img=(p.type.indexOf('ပုံ')>-1 && p.link)? '<img class="img" src="'+esc(p.link)+'" alt="">' : '';
  var vid=(!img && p.type.indexOf('Video')>-1 && p.link && p.link.indexOf('drive.google.com')>-1)? '<div style="position:relative;padding-top:56.25%;margin-top:10px"><iframe src="'+esc(p.link)+'" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:12px" allowfullscreen></iframe></div>' : '';
  var media=img||vid;
  var share=p.id? '<br><button class="sharebtn" onclick="copyLink(this,\''+esc(p.id)+'\')">🔗 Link ကူးမယ်</button>' : '';
  return '<article class="card"><span class="tag">'+esc(p.type)+'</span>'+ds+'<h2>'+esc(p.title)+'</h2><p>'+esc(p.body)+'</p>'+media+(media?'':btnFor(p))+share+'</article>';
}
function render(posts){
  if(!posts || !posts.length) return;
  var h='';
  for(var i=0;i<posts.length;i++) h+=cardHtml(posts[i]);
  document.getElementById('feed').innerHTML=h;
}
function start(posts){
  loaded=true;
  if(!posts || !posts.length){
    document.getElementById('feed').innerHTML='<p style="text-align:center;color:#aaa;padding:36px 0">ခုထိ post မရှိသေးဘူး</p>';
    return;
  }
  var hsh=location.hash.replace('#','');
  if(hsh){
    for(var i=0;i<posts.length;i++){
      if(posts[i].id===hsh){
        document.getElementById('feed').innerHTML='<p><a class="allink" href="./">← Post အားလုံး ကြည့်မယ်</a></p>'+cardHtml(posts[i]);
        return;
      }
    }
  }
  render(posts);
}
function copyLink(btn,id){
  var url='https://paingmoehtet.from-mm.dev/#'+id;
  var ta=document.createElement('textarea');
  ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  var ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  function done(){ btn.textContent='✅ ကူးပြီးပြီ'; setTimeout(function(){ btn.textContent='🔗 Link ကူးမယ်'; },2000); }
  if(ok){ done(); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done, function(){ btn.textContent=url; }); }
  else { btn.textContent=url; }
}
var loaded=false;
var cb='mp'+Date.now();
window[cb]=function(res){ if(res && res.ok) start(res.posts); };
setTimeout(function(){
  if(!loaded){
    var f=document.getElementById('feed');
    if(f) f.innerHTML='<p style="text-align:center;color:#aaa;padding:36px 0">Connection နှေးနေတယ် — page ကို refresh ပြန်လုပ်ပါ</p>';
  }
}, 20000);
var s=document.createElement('script');
s.src=API+'?callback='+cb+'&nocache='+Date.now();
document.body.appendChild(s);
</script>

</body>
</html>

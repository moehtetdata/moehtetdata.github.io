<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SW test</title><link rel="manifest" href="/manifest.webmanifest"></head>
<body><pre id="out">testing…</pre>
<script>
var o=document.getElementById('out');
var L=[];
function show(){o.textContent=L.join('\n');}
L.push('sw in navigator: '+('serviceWorker' in navigator));
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();L.push('beforeinstallprompt: FIRED');show();window._bip=e;});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(function(r){L.push('register OK: scope='+r.scope+' active='+!!r.active+' installing='+!!r.installing+' waiting='+!!r.waiting);show();}).catch(function(err){L.push('register FAILED: '+err);show();});
  navigator.serviceWorker.getRegistration().then(function(r){L.push('getRegistration: '+(r?('scope='+r.scope+' active='+!!r.active):'none'));show();});
}
setTimeout(show,5000);
</script></body></html>

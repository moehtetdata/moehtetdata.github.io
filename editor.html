<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post တင်ရန် — MoeHtet Sharing</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#f2f2f2}
  main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:22px} h2{font-size:17px;margin-top:28px}
  label{display:block;margin-top:14px;color:#bbb;font-size:14px}
  input,textarea,select{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1d24;color:#fff;font-size:16px}
  textarea{min-height:120px}
  button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#2f7bff;color:#fff;font-size:17px;font-weight:700}
  button:disabled{opacity:.5}
  .note{background:#1c2a1c;border:1px solid #2e4a2e;color:#b9d8b9;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.6}
  .err{background:#2a1c1c;border:1px solid #4a2e2e;color:#d8b9b9;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:14px}
  #status{margin-top:14px;font-size:15px}
  .post{background:#1a1d24;border-radius:12px;padding:12px 14px;margin-top:10px}
  .post b{font-size:15px} .post span{color:#9fb4ff;font-size:12px}
  .post div{color:#888;font-size:12px}
  .del{width:auto;margin-top:8px;padding:8px 14px;font-size:14px;background:#3a2020;color:#ff9c9c;border:1px solid #6b3030;border-radius:8px}
  .cpy{width:auto;margin-top:8px;margin-right:8px;padding:8px 14px;font-size:14px;background:#20303a;color:#9fd8ff;border:1px solid #30506b;border-radius:8px}
  .imgprev{width:100%;border-radius:12px;margin-top:10px}
  input[type=file]{padding:10px}
  a{color:#9fb4ff}
  #login{max-width:360px;margin:60px auto;padding:0 16px}
</style>
</head>
<body>
<div id="login">
  <h1>🔒 Login</h1>
  <label>Username <input id="lu" autocomplete="username"></label>
  <label>Password <input id="lp" type="password" autocomplete="current-password"></label>
  <button onclick="doLogin()">ဝင်မယ်</button>
  <div id="lerr" class="err" style="display:none">Username / Password မှားနေတယ်</div>
  <button id="fpbtn" onclick="loginFingerprint()" style="display:none;background:#20303a;border:1px solid #30506b;margin-top:14px">👆 Fingerprint နဲ့ ဝင်မယ်</button>
  <button onclick="enrollFingerprint()" style="background:transparent;border:0;color:#9fb4ff;font-size:14px;margin-top:8px">🔐 Fingerprint မှတ်ထားမယ် (အသစ်)</button>
  <div id="fpstatus" style="margin-top:10px;font-size:14px;color:#bbb"></div>
</div>
<main id="app" style="display:none">
  <h1>✍️ Post အသစ်တင်ရန်</h1>
  <div class="note">ဒီမှာ တင်လိုက်ရင် <b>paingmoehtet.from-mm.dev</b> မှာ လူတိုင်း တန်း မြင်ရမယ်။</div>

  <label>ခေါင်းစဉ် <input id="title" placeholder="ဥပမာ — VPN အကြောင်း"></label>
  <label>အမျိုးအစား
    <select id="kind">
      <option>စာသား</option><option>ပုံ</option><option>App Link</option><option>File</option><option>Video Link (တခါတလေ)</option>
    </select>
  </label>
  <label>စာသား <textarea id="body" placeholder="မျှဝေချင်တာ ရေးပါ…"></textarea></label>
  <label>Link (ပုံ / App / File / Video ရှိရင်) <input id="link" placeholder="https://…"></label>
  <label>📷🎬 ပုံ / Video တို တင်ရန် (ဖုန်းထဲက ရွေးလို့ရတယ်) <input id="imgfile" type="file" accept="image/*,video/*" onchange="uploadImage(this)"></label>
  <div id="upstatus" style="margin-top:8px;font-size:14px"></div>
  <img id="preview" class="imgprev" style="display:none" alt="">
  <button id="pub" onclick="publish()">📢 Publish တင်မယ်</button>
  <div id="status"></div>

  <h2>📌 တင်ထားပြီး Post များ</h2>
  <div id="list">ခဏစောင့်…</div>
  <p style="text-align:center;margin-top:20px"><a href="index.html">← Site ကို ကြည့်မယ်</a></p>
</main>
<script>
var API='https://script.google.com/macros/s/AKfycbyeXvBLYcbe038_QFTxiwulGH-oVbgsXI5_9VZ025MjfMaVGlRa_2QUX-0T6LTQeaxG8w/exec';
var KEY='mh3375tech';
var U='POSMOE2000', P='2000POS';
function doLogin(){
  if(document.getElementById('lu').value===U && document.getElementById('lp').value===P){
    try{sessionStorage.setItem('mh_editor','1');}catch(e){}
    showApp();
  } else {
    document.getElementById('lerr').style.display='block';
  }
}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  loadList();
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function jsonp(params, cb){
  var name='mp'+Date.now()+Math.floor(Math.random()*9999);
  var t=setTimeout(function(){ cb(null); }, 30000);
  window[name]=function(res){ clearTimeout(t); cb(res); };
  var q=[];
  for(var k in params) q.push(encodeURIComponent(k)+'='+encodeURIComponent(params[k]));
  var s=document.createElement('script');
  s.src=API+'?'+q.join('&')+'&callback='+name+'&nocache='+Date.now();
  document.body.appendChild(s);
}
function loadList(){
  jsonp({}, function(res){
    var el=document.getElementById('list');
    if(!res || !res.ok){ el.textContent='Post စာရင်း ဖတ်မရဘူး — ခဏနေ ပြန်စမ်းပါ'; return; }
    if(!res.posts.length){ el.textContent='ခုထိ post မရှိသေးဘူး'; return; }
    var h='';
    for(var i=0;i<res.posts.length;i++){
      var p=res.posts[i];
      var d=p.ts? new Date(p.ts).toLocaleDateString('en-GB'):'';
      h+='<div class="post"><span>'+esc(p.type)+'</span> <b>'+esc(p.title)+'</b><div>'+d+'</div>'+(p.id? '<button class="cpy" onclick="copyPostLink(\''+p.id+'\')">🔗 Link ကူးမယ်</button>' : '')+(p.row? '<button class="del" onclick="delPost('+p.row+')">🗑️ ဖျက်မယ်</button>' : '')+'</div>';
    }
    el.innerHTML=h;
  });
}
function copyPostLink(id){
  var url='https://paingmoehtet.from-mm.dev/#'+id;
  var st=document.getElementById('status');
  var ta=document.createElement('textarea');
  ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  var ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(ok){ st.textContent='✅ Link ကူးပြီးပြီ — ပို့ချင်တဲ့နေရာမှာ paste လုပ်ရုံပဲ'; }
  else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ st.textContent='✅ Link ကူးပြီးပြီ'; }, function(){ st.textContent='Link: '+url; }); }
  else { st.textContent='Link: '+url; }
}
function delPost(row){
  if(!confirm('ဒီ post ကို ဖျက်မှာ သေချာလား?')) return;
  var st=document.getElementById('status');
  st.textContent='ဖျက်နေတယ်…';
  jsonp({action:'delete', key:KEY, row:row}, function(res){
    if(res && res.ok){ st.textContent='🗑️ ဖျက်ပြီးပြီ'; loadList(); }
    else { st.textContent='❌ ဖျက်မရဘူး — ပြန်စမ်းပါ'; }
  });
}
var uploading=false;
function sendUpload(params, done){
  uploading=true;
  fetch(API,{method:'POST',body:params}).then(function(r){return r.text();}).then(function(t){
    uploading=false;
    var res=null; try{ res=JSON.parse(t); }catch(e){}
    done(res);
  }).catch(function(){ uploading=false; done(null); });
}
function uploadImage(inp){
  var f=inp.files && inp.files[0]; if(!f) return;
  if(f.type.indexOf('video/')===0){ uploadVideo(f); return; }
  var st=document.getElementById('upstatus'); st.textContent='ပုံ ပြင်နေတယ်…';
  var img=new Image();
  var url=URL.createObjectURL(f);
  img.onload=function(){
    var max=1280, w=img.width, h=img.height;
    var sc=Math.min(1, max/Math.max(w,h));
    var c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    var b64=c.toDataURL('image/jpeg',0.82).split(',')[1];
    st.textContent='ပုံ တင်နေတယ်… ခဏစောင့် (၁ မိနစ်လောက် ကြာနိုင်တယ်)';
    var params=new URLSearchParams(); params.append('action','upload'); params.append('key',KEY); params.append('kind','image'); params.append('name','img'+Date.now()+'.jpg'); params.append('img',b64);
    sendUpload(params, function(res){
      if(res && res.ok){
        document.getElementById('link').value=res.url;
        document.getElementById('kind').value='ပုံ';
        var pv=document.getElementById('preview'); pv.src=res.url; pv.style.display='block';
        st.textContent='✅ ပုံ တင်ပြီးပြီ — Publish နှိပ်ရင် post မှာ ပုံ တွဲပါမယ်';
      } else { st.textContent='❌ ပုံ တင်မရဘူး — ပြန်စမ်းပါ (သို့) ပုံ link ကူးထည့်ပြီး တင်ပါ'; }
    });
  };
  img.onerror=function(){ st.textContent='❌ ဒီပုံကို ဖတ်မရဘူး — တခြားပုံ စမ်းပါ'; };
  img.src=url;
}
function uploadVideo(f){
  var st=document.getElementById('upstatus');
  if(f.size > 30*1024*1024){ st.textContent='❌ Video က 30MB ထက် ကြီးနေတယ် — တိုတိုလေးပဲ တင်ပါ'; return; }
  st.textContent='Video သေးအောင် ဖိနေတယ်… (video အရှည်လောက် ခဏကြာမယ်)';
  compressVideo(f, function(blob, mime, ext){
    if(!blob){ sendVideoBlob(f, f.type||'video/mp4', (f.name.split('.').pop()||'mp4').toLowerCase()); return; }
    st.textContent='ဖိပြီးပြီ — မူလ ' + Math.round(f.size/1024) + ' KB → ' + Math.round(blob.size/1024) + ' KB. တင်နေတယ်…';
    sendVideoBlob(blob, mime, ext);
  });
}
function sendVideoBlob(blob, mime, ext){
  var st=document.getElementById('upstatus');
  var rd=new FileReader();
  rd.onload=function(){
    var b64=String(rd.result).split(',')[1];
    st.textContent='Video တင်နေတယ်… page မပိတ်ပါနဲ့';
    var params=new URLSearchParams(); params.append('action','upload'); params.append('key',KEY); params.append('kind','video'); params.append('mime',mime); params.append('name','vid'+Date.now()+'.'+ext); params.append('img',b64);
    sendUpload(params, function(res){
      if(res && res.ok){
        document.getElementById('link').value=res.url;
        document.getElementById('kind').value='Video Link (တခါတလေ)';
        st.textContent='✅ Video တင်ပြီးပြီ — Publish နှိပ်ရင် post မှာ video တွဲပါမယ် (site မှာ တန်း ကြည့်လို့ရမယ်)';
      } else { st.textContent='❌ Video တင်မရဘူး — connection စစ်ပြီး ပြန်စမ်းပါ'; }
    });
  };
  rd.onerror=function(){ st.textContent='❌ Video ဖတ်မရဘူး'; };
  rd.readAsDataURL(blob);
}
function compressVideo(f, done){
  var finished=false;
  function fin(b,m,e){ if(!finished){ finished=true; done(b,m,e); } }
  try{
    var url=URL.createObjectURL(f);
    var v=document.createElement('video');
    v.playsInline=true; v.preload='auto'; v.src=url;
    var timer=setTimeout(function(){ fin(null); }, 15000);
    v.onloadedmetadata=function(){
      var max=720, w=v.videoWidth||640, h=v.videoHeight||360;
      var sc=Math.min(1, max/Math.max(w,h));
      var c=document.createElement('canvas');
      c.width=Math.max(2, Math.round(w*sc/2)*2); c.height=Math.max(2, Math.round(h*sc/2)*2);
      var ctx=c.getContext('2d');
      var stream=c.captureStream(30);
      try{ var vs=v.captureStream(); vs.getAudioTracks().forEach(function(t){ stream.addTrack(t); }); }catch(e){}
      var rec;
      try{ rec=new MediaRecorder(stream,{mimeType:'video/webm', videoBitsPerSecond:2000000, audioBitsPerSecond:128000}); }
      catch(e){ clearTimeout(timer); fin(null); return; }
      var chunks=[];
      rec.ondataavailable=function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      rec.onstop=function(){ clearTimeout(timer); URL.revokeObjectURL(url); fin(new Blob(chunks,{type:'video/webm'}), 'video/webm', 'webm'); };
      var draw=function(){ if(!v.ended){ ctx.drawImage(v,0,0,c.width,c.height); if(!v.paused) requestAnimationFrame(draw); } };
      v.onplay=function(){ draw(); };
      v.onended=function(){ try{ rec.stop(); }catch(e){ clearTimeout(timer); fin(null); } };
      v.play().then(function(){ try{ rec.start(500); }catch(e){ clearTimeout(timer); fin(null); } draw(); }).catch(function(){ clearTimeout(timer); fin(null); });
    };
    v.onerror=function(){ clearTimeout(timer); fin(null); };
  }catch(e){ fin(null); }
}
function publish(){
  var title=document.getElementById('title').value.trim();
  var body=document.getElementById('body').value.trim();
  var st=document.getElementById('status');
  if(uploading){ st.textContent='⏳ ပုံ/Video တင်နေတုန်းမို့ ခဏစောင့်ပါ'; return; }
  if(!title){ st.textContent='⚠️ ခေါင်းစဉ် ထည့်ပါ'; return; }
  var btn=document.getElementById('pub');
  btn.disabled=true; st.textContent='တင်နေတယ်… ခဏစောင့်';
  jsonp({action:'add', key:KEY, title:title, type:document.getElementById('kind').value, body:body, link:document.getElementById('link').value.trim()}, function(res){
    btn.disabled=false;
    if(res && res.ok){
      st.textContent='✅ တင်ပြီးပြီ — site မှာ တန်း မြင်ရပြီ';
      document.getElementById('title').value=''; document.getElementById('body').value=''; document.getElementById('link').value='';
      document.getElementById('preview').style.display='none'; document.getElementById('upstatus').textContent=''; document.getElementById('imgfile').value='';
      loadList();
    } else {
      st.textContent='❌ မရဘူး — connection စစ်ပြီး ပြန်စမ်းပါ';
    }
  });
}
function b64e(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var bin=atob(s); var u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }
function enrollFingerprint(){
  var st=document.getElementById('fpstatus');
  if(!window.PublicKeyCredential){ st.textContent='❌ ဒီ browser က fingerprint မထောက်ပံ့ဘူး — Chrome နဲ့ ဖွင့်ပြီး စမ်းပါ'; return; }
  var challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
  navigator.credentials.create({publicKey:{
    challenge:challenge,
    rp:{id:location.hostname, name:'MoeHtet Editor'},
    user:{id:new TextEncoder().encode('avo-editor'), name:'avo', displayName:'Avo'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required'},
    timeout:60000
  }}).then(function(cred){
    try{ localStorage.setItem('mh_fp_cred', b64e(cred.rawId)); }catch(e){}
    st.textContent='✅ မှတ်ထားပြီးပြီ — နောက်တစ်ခါ 👆 Fingerprint နဲ့ ဝင်လို့ရပြီ';
    document.getElementById('fpbtn').style.display='block';
  }).catch(function(err){ st.textContent='❌ မရဘူး ('+err.name+') — ပြန်စမ်းပါ'; });
}
function loginFingerprint(){
  var st=document.getElementById('fpstatus');
  var id=null; try{ id=localStorage.getItem('mh_fp_cred'); }catch(e){}
  if(!id){ st.textContent='အရင် "🔐 Fingerprint မှတ်ထားမယ်" နဲ့ မှတ်ထားပါ'; return; }
  var challenge=new Uint8Array(32); crypto.getRandomValues(challenge);
  navigator.credentials.get({publicKey:{
    challenge:challenge,
    rpId:location.hostname,
    allowCredentials:[{type:'public-key', id:b64d(id)}],
    userVerification:'required',
    timeout:60000
  }}).then(function(){
    try{ sessionStorage.setItem('mh_editor','1'); }catch(e){}
    showApp();
  }).catch(function(err){ st.textContent='❌ Fingerprint အတည်ပြုမရဘူး — password နဲ့ ဝင်ပါ'; });
}
try{ if(localStorage.getItem('mh_fp_cred')) document.getElementById('fpbtn').style.display='block'; }catch(e){}
try{ if(sessionStorage.getItem('mh_editor')==='1') showApp(); }catch(e){}
</script>
</body>
</html>
